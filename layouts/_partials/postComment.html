<!-- Post Comment Form -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<div class="box">
    <h3 class="title is-4">Post a Comment</h3>
    <form id="commentForm">
        <div class="field">
            <label class="label">Name</label>
            <div class="control">
                <input class="input" type="text" id="name" placeholder="Your Name" required />
            </div>
        </div>

        <div class="field">
            <label class="label">Comment</label>
            <div class="control">
                <textarea class="textarea" id="comment" placeholder="Your comment..." required></textarea>
            </div>
        </div>

        <div class="field">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEhVn_r1wv8HHNku"></div>
        </div>

        <p id="commentError" class="has-text-danger" style="display:none;"></p>

        <div class="field">
            <div class="control">
                <button type="submit" class="button is-link">Post Comment</button>
            </div>
        </div>
    </form>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const commentForm = document.getElementById('commentForm');
    const commentError = document.getElementById('commentError');

    const GRAPHQL_ENDPOINT = "https://z2ujenfjtzhdngdxb7xe5pld3i.appsync-api.us-east-2.amazonaws.com/graphql";
    const API_KEY = "da2-zmx7kmlw7ze4hioupggncn3xtm";

    function showError(message) {
        commentError.textContent = message;
        commentError.style.display = "block";
    }

    function hideError() {
        commentError.style.display = "none";
    }

    function resetTurnstile() {
        if (typeof turnstile !== "undefined") {
            turnstile.reset();
        }
    }

    commentForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        hideError();

        const turnstileToken = typeof turnstile !== "undefined" ? turnstile.getResponse() : "";
        if (!turnstileToken) {
            showError("Please complete the captcha before posting.");
            return;
        }

        const name = document.getElementById('name').value;
        const comment = document.getElementById('comment').value;

        // Hugo page URL = used as post identifier
        const postSlug = window.location.pathname;

        const mutation = `
            mutation CreateComment($input: CreateGrizcommentsInput!) {
                createGrizcomments(input: $input) {
                    id
                    name
                    comment
                    postSlug
                    createdAt
                    approved
                }
            }
        `;

        const variables = {
            input: {
                id: crypto.randomUUID(),
                name: name,
                comment: comment,
                url: "https://griz.sh",   // REQUIRED by your schema (AWSURL!)
                postSlug: postSlug,
                approved: true,
                createdAt: new Date().toISOString()
            }
        };

        try {
            const response = await fetch(GRAPHQL_ENDPOINT, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY,
                    "x-turnstile-token": turnstileToken
                },
                body: JSON.stringify({
                    query: mutation,
                    variables: variables
                })
            });

            const result = await response.json();

            if (result.errors) {
                console.error("GraphQL errors:", result.errors);
                // Match on the resolver's own message text, not just errorType:
                // "Unauthorized" is also what AppSync returns for e.g. an invalid
                // API key, which is a different problem than a failed captcha.
                const isCaptchaError = result.errors.some(e => (e.message || "").includes("Turnstile"));
                showError(isCaptchaError
                    ? "Captcha verification failed. Please try again."
                    : "Something went wrong posting your comment. Please try again.");
                resetTurnstile();
                return;
            }

            console.log("Posted comment:", result.data);

            // reset form (also clears the solved captcha token, since it's single-use)
            commentForm.reset();
            resetTurnstile();

            // reload comments if you have that function
            if (typeof loadComments === "function") {
                loadComments();
            }

        } catch (error) {
            console.error("Error posting comment:", error);
            showError("Something went wrong posting your comment. Please try again.");
            resetTurnstile();
        }
    });
});
</script>
