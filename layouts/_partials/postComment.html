<!-- Post Comment Form -->
<div class="box">
    <h3 class="title is-4">Post a Comment</h3>
    <form id="commentForm">
        <div class="field">
            <label class="label">Name</label>
            <div class="control">
                <input class="input" type="text" id="name" placeholder="Your Name" required />
            </div>
        </div>
        
        <div class="field">
            <label class="label">Comment</label>
            <div class="control">
                <textarea class="textarea" id="comment" placeholder="Your comment..." required></textarea>
            </div>
        </div>

        <div class="field">
            <div class="control">
                <button type="submit" class="button is-link">Post Comment</button>
            </div>
        </div>
    </form>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const commentForm = document.getElementById('commentForm');

    const GRAPHQL_ENDPOINT = "https://z2ujenfjtzhdngdxb7xe5pld3i.appsync-api.us-east-2.amazonaws.com/graphql";
    const API_KEY = "da2-sk3e55afnreqlouickerohnxsa";

    commentForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const name = document.getElementById('name').value;
        const comment = document.getElementById('comment').value;

        // Hugo page URL = used as post identifier
        const postSlug = window.location.pathname;

        const mutation = `
            mutation CreateComment($input: CreateGrizcommentsInput!) {
                createGrizcomments(input: $input) {
                    id
                    name
                    comment
                    postSlug
                    createdAt
                    approved
                }
            }
        `;

        const variables = {
            input: {
                id: crypto.randomUUID(),
                name: name,
                comment: comment,
                url: "https://griz.sh",   // REQUIRED by your schema (AWSURL!)
                postSlug: postSlug,
                approved: true,
                createdAt: new Date().toISOString()
            }
        };

        try {
            const response = await fetch(GRAPHQL_ENDPOINT, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY
                },
                body: JSON.stringify({
                    query: mutation,
                    variables: variables
                })
            });

            const result = await response.json();

            if (result.errors) {
                console.error("GraphQL errors:", result.errors);
                throw new Error("Failed to post comment");
            }

            console.log("Posted comment:", result.data);

            // reset form
            commentForm.reset();

            // reload comments if you have that function
            if (typeof loadComments === "function") {
                loadComments();
            }

        } catch (error) {
            console.error("Error posting comment:", error);
        }
    });
});
</script>
