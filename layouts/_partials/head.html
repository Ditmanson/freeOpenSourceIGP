<meta charset="utf-8">
<title>
  {{ if .IsHome }}
    {{ .Site.Title }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>

{{ if or (eq .Kind "page") (eq .Kind "home") }}
<!-- htmx + client-side-templates (renders JSON API responses via Mustache) + Alpine (UI state).
     Loaded on individual post pages (layouts/page.html, for comments.html/postComment.html)
     and the homepage (layouts/home.html, for chatWidget.html) - other section/tag pages
     don't need these. -->
<!-- htmx 2.x defaults to selfRequestsOnly:true, blocking cross-origin requests (htmx:invalidPath).
     Our GraphQL API lives on a different origin (AppSync) than this site, so this must be
     disabled - htmx reads this meta tag during its own startup, before processing the page. -->
<meta name="htmx-config" content='{"selfRequestsOnly": false}'>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/htmx-ext-client-side-templates@2.0.2/client-side-templates.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.3/json-enc.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.16.3/dist/cdn.min.js" defer></script>
{{ end }}
