<h1>{{ .Title }}</h1>

<h2>Comments</h2>

<!-- Displaying the loaded comments -->
<div id="commentsList" style="display:none;">
    <div id="comments" class="box"></div>
</div>

<!-- Message when no comments are loaded -->
<div id="noCommentsMessage">Loading comments...</div>
<script>
window.addEventListener('DOMContentLoaded', () => {
    loadComments();
});

const GRAPHQL_ENDPOINT = "https://z2ujenfjtzhdngdxb7xe5pld3i.appsync-api.us-east-2.amazonaws.com/graphql";
const API_KEY = "da2-sk3e55afnreqlouickerohnxsa";

async function loadComments() {
    const commentsContainer = document.getElementById('comments');
    const commentsList = document.getElementById('commentsList');
    const noCommentsMessage = document.getElementById('noCommentsMessage');

    const postSlug = window.location.pathname;

    const query = `
        query ListComments($filter: TableGrizcommentsFilterInput) {
            listGrizcomments(filter: $filter) {
                items {
                    id
                    name
                    comment
                    postSlug
                    createdAt
                    approved
                }
            }
        }
    `;

    const variables = {
        filter: {
            postSlug: {
                eq: postSlug
            },
            approved: {
                eq: true
            }
        }
    };

    try {
        const response = await fetch(GRAPHQL_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-api-key": API_KEY
            },
            body: JSON.stringify({
                query,
                variables
            })
        });

        const result = await response.json();

        if (result.errors) {
            console.error(result.errors);
            throw new Error("GraphQL error");
        }

        const items = result.data.listGrizcomments.items || [];

        commentsContainer.innerHTML = '';

        if (items.length === 0) {
            noCommentsMessage.innerText = "No comments yet.";
            noCommentsMessage.style.display = "block";
            commentsList.style.display = "none";
            return;
        }

        noCommentsMessage.style.display = "none";
        commentsList.style.display = "block";

        items.forEach(comment => {
            const div = document.createElement('div');
            div.className = 'box';

            div.innerHTML = `
                <strong>${escapeHtml(comment.name)}</strong><br>
                <p>${escapeHtml(comment.comment)}</p>
            `;

            commentsContainer.appendChild(div);
        });

    } catch (err) {
        console.error('Error loading comments:', err);
        noCommentsMessage.innerText = "Error loading comments.";
    }
}

// basic XSS protection (IMPORTANT)
function escapeHtml(str) {
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}
</script>
